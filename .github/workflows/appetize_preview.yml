name: Appetize.io In-Browser Preview

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Appetize.io
        id: appetize
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi

          TOKEN="${{ secrets.APPETIZE_API_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "::error::APPETIZE_API_TOKEN secret is empty or not found in GitHub repository secrets!"
            exit 1
          fi

          echo "Uploading $APK_PATH to Appetize.io..."

          # Upload APK using Appetize.io API (supports basic auth & token param)
          HTTP_RESPONSE=$(curl --silent --show-error \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            --user "${TOKEN}:" \
            --request POST "https://api.appetize.io/v1/apps?token=${TOKEN}" \
            --form "file=@${APK_PATH}" \
            --form "platform=android")

          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Appetize HTTP Status Code: $HTTP_STATUS"
          echo "Appetize Response Body: $RESPONSE_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Appetize upload failed with HTTP status $HTTP_STATUS: $RESPONSE_BODY"
            exit 1
          fi

          # Extract public key and app URL using python3
          PUBLIC_KEY=$(python3 -c "import json, sys; res = json.loads(sys.stdin.read()); print(res.get('publicKey', ''))" <<< "$RESPONSE_BODY")
          APP_URL=$(python3 -c "import json, sys; res = json.loads(sys.stdin.read()); print(res.get('publicURL', ''))" <<< "$RESPONSE_BODY")

          if [ -z "$APP_URL" ] && [ -n "$PUBLIC_KEY" ]; then
            APP_URL="https://appetize.io/app/${PUBLIC_KEY}"
          fi

          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::Failed to obtain publicKey from Appetize response."
            exit 1
          fi

          echo "PUBLIC_KEY=$PUBLIC_KEY" >> $GITHUB_OUTPUT
          echo "APP_URL=$APP_URL" >> $GITHUB_OUTPUT

          # Add link to GitHub Actions Run Summary
          echo "### 🚀 Appetize.io Preview Ready!" >> $GITHUB_STEP_SUMMARY
          echo "View and interact with your app in the browser:" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Play App on Appetize.io]($APP_URL)**" >> $GITHUB_STEP_SUMMARY

      - name: Comment Preview Link on Pull Request
        if: github.event_name == 'pull_request' && steps.appetize.outputs.APP_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            const appUrl = "${{ steps.appetize.outputs.APP_URL }}";
            const commentBody = `### 📱 Appetize.io App Preview\n\nYour app has been built and deployed to Appetize.io!\n\n👉 **[Click here to test your app in-browser](${appUrl})**`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => comment.body.includes('Appetize.io App Preview'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
