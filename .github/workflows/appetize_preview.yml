name: Appetize.io In-Browser Preview

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Appetize.io
        id: appetize
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi

          if [ -z "${{ secrets.APPETIZE_API_TOKEN }}" ]; then
            echo "::error::APPETIZE_API_TOKEN secret is not set in GitHub repository secrets!"
            exit 1
          fi

          # Upload APK using Appetize.io API v2
          RESPONSE=$(curl --silent --show-error --fail \
            --request POST 'https://api.appetize.io/v2/apps' \
            --header "Authorization: Bearer ${{ secrets.APPETIZE_API_TOKEN }}" \
            --form "file=@${APK_PATH}" \
            --form "platform=android")

          echo "Appetize Response: $RESPONSE"

          # Extract public key / app URL from response
          PUBLIC_KEY=$(echo "$RESPONSE" | grep -o '"publicKey":"[^"]*' | cut -d'"' -f4)
          APP_URL="https://appetize.io/app/${PUBLIC_KEY}"

          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::Failed to parse publicKey from Appetize response."
            exit 1
          fi

          echo "PUBLIC_KEY=$PUBLIC_KEY" >> $GITHUB_OUTPUT
          echo "APP_URL=$APP_URL" >> $GITHUB_OUTPUT

          # Add link to GitHub Actions Run Summary
          echo "### 🚀 Appetize.io Preview Ready!" >> $GITHUB_STEP_SUMMARY
          echo "View and interact with your app in the browser:" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Play App on Appetize.io]($APP_URL)**" >> $GITHUB_STEP_SUMMARY

      - name: Comment Preview Link on Pull Request
        if: github.event_name == 'pull_request' && steps.appetize.outputs.APP_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            const appUrl = "${{ steps.appetize.outputs.APP_URL }}";
            const commentBody = `### 📱 Appetize.io App Preview\n\nYour app has been built and deployed to Appetize.io!\n\n👉 **[Click here to test your app in-browser](${appUrl})**`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => comment.body.includes('Appetize.io App Preview'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
